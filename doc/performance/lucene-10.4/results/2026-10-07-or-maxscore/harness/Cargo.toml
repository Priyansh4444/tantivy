[package]
name = "balanced-search"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tantivy = { path = "../../../tantivy-or-maxscore-oct06" }
lucene-rs = { path = "../../../lucene-rs-idf-fix-oct06" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = false
panic = "abort"
debug = false

